<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reimiyo Chat</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fb;color:#1f2937}
    .wrap{max-width:720px;margin:0 auto;min-height:100vh;padding:24px 14px}
    .card{background:#fff;border-radius:18px;box-shadow:0 8px 30px #00000012;padding:22px}
    h1{margin:0 0 6px;font-size:25px}
    .sub{margin:0 0 20px;color:#6b7280;font-size:14px}
    label{display:block;font-weight:700;margin:14px 0 6px}
    input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:11px;font-size:16px}
    button{border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}
    .primary{width:100%;margin-top:18px;background:#111827;color:white}
    .secondary{background:#eef2ff;color:#3730a3}
    .danger{background:#fee2e2;color:#991b1b}
    .hidden{display:none!important}
    .roomhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    .roomname{font-weight:800}
    #messages{height:55vh;min-height:360px;overflow:auto;background:#f8fafc;border-radius:13px;padding:12px}
    .msg{margin:8px 0;padding:9px 11px;background:#fff;border-radius:12px;box-shadow:0 1px 3px #0000000d}
    .meta{font-size:12px;color:#6b7280;margin-bottom:3px}
    .text{white-space:pre-wrap;overflow-wrap:anywhere}
    .send{display:flex;gap:8px;margin-top:10px}
    .send input{flex:1}
    .send button{background:#111827;color:#fff}
    .notice{font-size:12px;color:#6b7280;margin-top:12px;line-height:1.5}
    #status{margin-top:10px;font-size:13px;color:#b45309;min-height:20px}
  </style>
</head>
<body>
<div class="wrap">
  <section id="join" class="card">
    <h1>Reimiyo Chat</h1>
    <p class="sub">合言葉が同じ人だけが同じルームに入れるリアルタイムチャット</p>

    <label for="name">ニックネーム</label>
    <input id="name" maxlength="30" autocomplete="nickname" placeholder="例：みよみよ" />

    <label for="pass">合言葉</label>
    <input id="pass" type="password" maxlength="100" autocomplete="off" placeholder="ルームの合言葉" />

    <button id="joinBtn" class="primary">入室する</button>
    <div id="status"></div>
    <p class="notice">※この版では合言葉からルームIDを作ります。公開前にFirestoreのルールを設定してください。</p>
  </section>

  <section id="room" class="card hidden">
    <div class="roomhead">
      <div>
        <div class="roomname" id="roomLabel"></div>
        <div class="sub" style="margin:3px 0 0">リアルタイムチャット</div>
      </div>
      <button id="leaveBtn" class="danger">退室</button>
    </div>

    <div id="messages"></div>

    <div class="send">
      <input id="message" maxlength="1000" placeholder="メッセージを入力..." autocomplete="off" />
      <button id="sendBtn">送信</button>
    </div>
    <div id="roomStatus" class="notice"></div>
  </section>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyApwDLzaXBzExpgJKZsHvR0IZK_aQMBUIY",
    authDomain: "reimiyo-5e986.firebaseapp.com",
    projectId: "reimiyo-5e986",
    storageBucket: "reimiyo-5e986.firebasestorage.app",
    messagingSenderId: "492418739780",
    appId: "1:492418739780:web:f4e59c7b2a4999ebbf1611"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = id => document.getElementById(id);
  let unsubscribe = null;
  let currentRoom = null;
  let currentName = null;

  async function sha256(text) {
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function ensureAuth() {
    if (!auth.currentUser) await signInAnonymously(auth);
  }

  $("joinBtn").addEventListener("click", async () => {
    const name = $("name").value.trim();
    const pass = $("pass").value;

    if (!name || !pass) {
      $("status").textContent = "ニックネームと合言葉を入力してください。";
      return;
    }

    $("status").textContent = "接続しています...";
    try {
      await ensureAuth();
      currentRoom = await sha256(pass);
      currentName = name;

      $("join").classList.add("hidden");
      $("room").classList.remove("hidden");
      $("roomLabel").textContent = "ルーム：" + currentRoom.slice(0, 10);
      $("status").textContent = "";

      const messagesRef = collection(db, "rooms", currentRoom, "messages");
      const q = query(messagesRef, orderBy("createdAt", "asc"), limit(200));

      unsubscribe = onSnapshot(q, snap => {
        const box = $("messages");
        box.innerHTML = "";
        snap.forEach(doc => {
          const m = doc.data();
          const item = document.createElement("div");
          item.className = "msg";

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = m.name || "匿名";

          const text = document.createElement("div");
          text.className = "text";
          text.textContent = m.text || "";

          item.append(meta, text);
          box.appendChild(item);
        });
        box.scrollTop = box.scrollHeight;
      }, err => {
        $("roomStatus").textContent = "読み込みエラー：" + err.message;
      });
    } catch (e) {
      $("status").textContent = "接続できませんでした。Firebase Authenticationの匿名ログインを有効にしてください。";
      console.error(e);
    }
  });

  async function sendMessage() {
    const text = $("message").value.trim();
    if (!text || !currentRoom || !auth.currentUser) return;

    try {
      await addDoc(collection(db, "rooms", currentRoom, "messages"), {
        name: currentName,
        text,
        uid: auth.currentUser.uid,
        createdAt: serverTimestamp()
      });
      $("message").value = "";
      $("message").focus();
    } catch (e) {
      $("roomStatus").textContent = "送信できませんでした：" + e.message;
    }
  }

  $("sendBtn").addEventListener("click", sendMessage);
  $("message").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  $("leaveBtn").addEventListener("click", () => {
    if (unsubscribe) unsubscribe();
    unsubscribe = null;
    currentRoom = null;
    currentName = null;
    $("messages").innerHTML = "";
    $("message").value = "";
    $("room").classList.add("hidden");
    $("join").classList.remove("hidden");
  });
</script>
</body>
</html>
